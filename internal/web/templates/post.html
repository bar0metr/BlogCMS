{{define "content"}}
  <div class="card">
    <div class="muted fs-12">/{{.Post.Slug}}</div>
    <h1 class="mt-10 m-0">{{.Post.Title}}</h1>
    {{if .Post.Tags}}
      <div class="mt-10">
        {{range .Post.Tags}}
          <a class="tag" href="/tag/{{.Slug}}">{{.Name}}</a>
        {{end}}
      </div>
    {{end}}
  </div>

  <div class="card">
    <article>{{safeHTML .Post.ContentHTML}}</article>
  </div>
{{end}}
