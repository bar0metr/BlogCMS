{{define "content"}}
  <div class="card">
    <div class="muted">Latest posts</div>
  </div>

  {{if .Posts}}
    {{range .Posts}}
      <div class="card">
        <div class="flex-between-baseline">
          <div><a href="/post/{{.Slug}}"><strong>{{.Title}}</strong></a></div>
          {{if .PublishedAt}}<div class="muted fs-12">{{.PublishedAt.Format "2006-01-02"}}</div>{{end}}
        </div>
        {{if .Excerpt}}<div class="post-excerpt muted">{{.Excerpt}}</div>{{end}}
        {{if .Tags}}
          <div class="mt-10">
            {{range .Tags}}
              <a class="tag" href="/tag/{{.Slug}}">{{.Name}}</a>
            {{end}}
          </div>
        {{end}}
      </div>
    {{end}}
  {{else}}
    <div class="card muted">No posts yet.</div>
  {{end}}
{{end}}
