{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="csrf-token" content="{{.CSRFToken}}"/>
  <title>{{.PageTitle .TitleSuffix}}</title>
  <link rel="stylesheet" href="/static/site.css"/>
</head>
<body>
  <header>
    <div><a href="/"><strong>{{.BlogTitle}}</strong></a></div>
    <nav class="muted">
      {{if .IsAuthed}}<a href="/admin">Admin</a>{{end}}
    </nav>
  </header>

  <div class="wrap">
    <main>
      {{template "content" .}}
    </main>
    <aside>
      <div class="card">
        <div class="muted mb-8">Tag cloud</div>
        {{if .TagCloud}}
          {{range .TagCloud}}
            <a class="tag" href="/tag/{{.Slug}}">{{.Name}} ({{.Used}})</a>
          {{end}}
        {{else}}
          <div class="muted">No tags yet.</div>
        {{end}}
      </div>
      <div class="card">
        <div class="muted mb-8">About</div>
        <div class="muted">{{.BlogAbout}}</div>
      </div>
    </aside>
  </div>

  {{if .BlogFooter}}
    <footer class="footer muted">
      {{.BlogFooter}}
    </footer>
  {{end}}
</body>
</html>
{{end}}
